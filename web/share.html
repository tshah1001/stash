<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Saving to Stash...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .container {
      background: white;
      border-radius: 16px;
      padding: 40px 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .icon {
      font-size: 64px;
      margin-bottom: 20px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    h1 {
      color: #1f2937;
      font-size: 24px;
      margin-bottom: 12px;
    }

    .message {
      color: #6b7280;
      font-size: 16px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .url-preview {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      color: #4b5563;
      word-break: break-all;
      margin-bottom: 24px;
      text-align: left;
    }

    .spinner {
      border: 4px solid #e5e7eb;
      border-top: 4px solid #6366f1;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .success {
      color: #10b981;
      font-size: 48px;
    }

    .error {
      color: #ef4444;
      font-size: 48px;
    }

    .button {
      display: inline-block;
      padding: 12px 24px;
      background: #6366f1;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      margin-top: 16px;
      transition: background 0.2s;
    }

    .button:hover {
      background: #4f46e5;
    }

    .error-details {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 12px;
      margin-top: 16px;
      font-size: 14px;
      color: #991b1b;
      text-align: left;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loading-state">
      <div class="spinner"></div>
      <h1>Saving to Stash...</h1>
      <p class="message">Extracting article content and saving to your library</p>
      <div id="url-preview" class="url-preview hidden"></div>
    </div>

    <div id="success-state" class="hidden">
      <div class="icon success">✓</div>
      <h1>Saved Successfully!</h1>
      <p class="message">Article has been added to your Stash</p>
      <a href="/" class="button">View in Stash</a>
    </div>

    <div id="error-state" class="hidden">
      <div class="icon error">✕</div>
      <h1>Save Failed</h1>
      <p class="message" id="error-message">Something went wrong while saving</p>
      <div id="error-details" class="error-details hidden"></div>
      <a href="/" class="button">Return to Stash</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="share.js"></script>
</body>
</html>
